<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Upload Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 800px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
            background: #f8f9ff;
        }

        .upload-area:hover {
            border-color: #764ba2;
            background: #f0f2ff;
        }

        .upload-area.dragover {
            border-color: #764ba2;
            background: #e8ebff;
            transform: scale(1.02);
        }

        .upload-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        input[type="file"] {
            display: none;
        }

        .file-info {
            margin-top: 20px;
            padding: 15px;
            background: #f0f2ff;
            border-radius: 10px;
            display: none;
        }

        .file-info.show {
            display: block;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s ease;
            width: 100%;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .result {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            border-left: 4px solid #667eea;
            display: none;
        }

        .result.show {
            display: block;
        }

        .result h3 {
            color: #333;
            margin-bottom: 15px;
        }

        .result.success {
            background: #d4edda;
            border-left-color: #28a745;
        }

        .result.error {
            background: #f8d7da;
            border-left-color: #dc3545;
        }

        .extracted-text {
            background: white;
            padding: 15px;
            border-radius: 8px;
            max-height: 400px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.6;
            color: #333;
            border: 1px solid #ddd;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .stat-box {
            background: white;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid #ddd;
        }

        .stat-label {
            font-size: 12px;
            color: #666;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
        }

        .loading {
            display: none;
            margin-top: 20px;
            text-align: center;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>📄 PDF & DOCX Upload Test</h1>

        <p class="subtitle">Upload a PDF or DOCX file to test text extraction and AI analysis</p>

        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">📁</div>
            <h3>Click to select or drag & drop a PDF or DOCX file</h3>
            <p style="color: #666; margin-top: 10px;">Maximum file size: 50MB</p>
            <input type="file" id="fileInput" accept=".pdf,.docx">
        </div>

        <div class="file-info" id="fileInfo">
            <strong>Selected file:</strong> <span id="fileName"></span><br>
            <strong>Size:</strong> <span id="fileSize"></span>
        </div>

        <button id="extractBtn" disabled>Step 1: Extract Text from Document</button>
        <button id="analyzeBtn" disabled
            style="display:none; background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);">Step 2: Analyze with
            AI</button>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Processing...</p>
        </div>

        <div class="result" id="result">
            <h3 id="resultTitle"></h3>
            <div id="resultContent"></div>
        </div>
    </div>
    <script>
        const API_URL = 'http://localhost:8000/api';

        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const fileInfo = document.getElementById('fileInfo');
        const fileName = document.getElementById('fileName');
        const fileSize = document.getElementById('fileSize');
        const extractBtn = document.getElementById('extractBtn');
        const analyzeBtn = document.getElementById('analyzeBtn');
        const loading = document.getElementById('loading');
        const result = document.getElementById('result');
        const resultTitle = document.getElementById('resultTitle');
        const resultContent = document.getElementById('resultContent');

        let selectedFile = null;
        let extractedText = null;        // Click to upload
        uploadArea.addEventListener('click', () => fileInput.click());

        // Drag & drop
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');

            const files = e.dataTransfer.files;
            if (files.length > 0) {
                const file = files[0];
                const validTypes = ['application/pdf', 'application/vnd.openxmlformats-officedocument.wordprocessingml.document'];
                if (validTypes.includes(file.type) || file.name.toLowerCase().endsWith('.pdf') || file.name.toLowerCase().endsWith('.docx')) {
                    handleFileSelect(file);
                } else {
                    showError('Please drop a PDF or DOCX file');
                }
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFileSelect(e.target.files[0]);
            }
        });

        function handleFileSelect(file) {
            selectedFile = file;
            fileName.textContent = file.name;
            fileSize.textContent = formatFileSize(file.size);
            fileInfo.classList.add('show');
            extractBtn.disabled = false;
            analyzeBtn.style.display = 'none';
            analyzeBtn.disabled = true;
            result.classList.remove('show');
        }

        function formatFileSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(2) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
        }

        // STEP 1: Extract text from PDF (no AI, no database)
        extractBtn.addEventListener('click', async () => {
            if (!selectedFile) return;

            extractBtn.disabled = true;
            analyzeBtn.style.display = 'none';
            loading.classList.add('show');
            loading.querySelector('p').textContent = 'Extracting text from PDF...';
            result.classList.remove('show');

            try {
                const formData = new FormData();
                formData.append('file', selectedFile);

                console.log('Extracting text from:', selectedFile.name);

                const response = await fetch(`${API_URL}/documents/extract-text`, {
                    method: 'POST',
                    body: formData
                });

                console.log('Response status:', response.status);

                let data;
                try {
                    data = await response.json();
                    console.log('Extracted text length:', data.text?.length);
                } catch (e) {
                    throw new Error(`Server returned invalid JSON (status ${response.status})`);
                }

                if (!response.ok) {
                    let errorMsg = 'Unknown error';
                    if (typeof data.detail === 'string') {
                        errorMsg = data.detail;
                    } else if (typeof data.message === 'string') {
                        errorMsg = data.message;
                    } else if (data.detail) {
                        errorMsg = JSON.stringify(data.detail);
                    } else {
                        errorMsg = JSON.stringify(data);
                    }
                    throw new Error(`Extraction failed (${response.status}): ${errorMsg}`);
                }

                extractedText = data.text;
                showExtractedText(data);

                // Enable step 2
                analyzeBtn.style.display = 'block';
                analyzeBtn.disabled = false;

            } catch (error) {
                console.error('Error details:', error);
                showError(error.message || String(error));
                extractBtn.disabled = false;
            } finally {
                loading.classList.remove('show');
            }
        });

        // STEP 2: Send text to OpenAI for analysis
        analyzeBtn.addEventListener('click', async () => {
            if (!extractedText) return;

            analyzeBtn.disabled = true;
            loading.classList.add('show');
            loading.querySelector('p').textContent = 'Analyzing with AI... (making 1 API call)';

            try {
                // Create a simple prompt with the extracted text
                const prompt = `Please analyze the following document text and provide:
1. A hierarchical outline with main sections and subsections
2. The 10 most important main points

Document text:
${extractedText.substring(0, 60000)}

Please respond in JSON format with this structure:
{
  "outline": {
    "title": "Document title",
    "sections": [
      {"level": 1, "title": "Section title", "children": []}
    ]
  },
  "main_points": [
    {"point": "Main point", "explanation": "Brief explanation"}
  ]
}`;

                console.log('Sending prompt to OpenAI (length:', prompt.length, 'chars)');

                // Make direct call to OpenAI through our backend
                const response = await fetch(`${API_URL}/documents/analyze-text`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        text: extractedText.substring(0, 60000)
                    })
                });

                console.log('Response status:', response.status);

                let data;
                try {
                    data = await response.json();
                    console.log('Analysis result:', data);
                } catch (e) {
                    throw new Error(`Server returned invalid JSON (status ${response.status})`);
                }

                if (!response.ok) {
                    let errorMsg = 'Unknown error';
                    if (typeof data.detail === 'string') {
                        errorMsg = data.detail;
                    } else if (typeof data.message === 'string') {
                        errorMsg = data.message;
                    } else if (data.detail) {
                        errorMsg = JSON.stringify(data.detail);
                    } else {
                        errorMsg = JSON.stringify(data);
                    }
                    throw new Error(`Analysis failed (${response.status}): ${errorMsg}`);
                }

                showAnalysisResult(data);

            } catch (error) {
                console.error('Analysis error:', error);
                showError(error.message || String(error));
            } finally {
                loading.classList.remove('show');
                analyzeBtn.disabled = false;
            }
        });

        function showExtractedText(data) {
            result.className = 'result show success';
            resultTitle.textContent = '✅ Step 1 Complete: Text Extracted!';

            const pageOrParaLabel = data.page_count ? 'Pages' : 'Paragraphs';
            const pageOrParaValue = data.page_count || data.paragraph_count || 'N/A';

            const previewLength = 10000; // Show first 10k characters
            const isLong = data.text.length > previewLength;
            const previewText = isLong ? data.text.substring(0, previewLength) : data.text;

            const stats = `
                <div class="stats">
                    <div class="stat-box">
                        <div class="stat-label">Characters</div>
                        <div class="stat-value">${data.text.length.toLocaleString()}</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-label">${pageOrParaLabel}</div>
                        <div class="stat-value">${pageOrParaValue}</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-label">Words (approx)</div>
                        <div class="stat-value">${Math.round(data.text.split(/\s+/).length).toLocaleString()}</div>
                    </div>
                </div>
                <p style="color: #28a745; margin-top: 15px;">✅ Text extracted successfully! Full text will be sent to AI in Step 2.</p>
                <div style="margin-top: 20px;">
                    <h4 style="color: #333; margin-bottom: 10px;">Preview of extracted text (${isLong ? 'first 10,000 chars' : 'complete'}):</h4>
                    <div class="extracted-text">${escapeHtml(previewText)}${isLong ? '\n\n... [Truncated for display. Full text contains ' + data.text.length.toLocaleString() + ' characters and will be used in Step 2]' : ''}</div>
                </div>
            `;

            resultContent.innerHTML = stats;
        }

        function showAnalysisResult(data) {
            result.className = 'result show success';
            resultTitle.textContent = '🎯 Step 2 Complete: AI Analysis';

            let analysisHtml = '<div style="background: white; padding: 20px; border-radius: 10px; margin-top: 20px;">';

            analysisHtml += '<p style="color: #28a745; margin-bottom: 20px;">✅ Analysis completed with 1 API call!</p>';

            if (data.main_points && data.main_points.length > 0) {
                analysisHtml += '<h4 style="color: #333; margin-bottom: 15px;">📌 Main Points:</h4>';
                analysisHtml += '<ul style="margin-bottom: 25px;">';
                data.main_points.forEach(point => {
                    const pointText = typeof point === 'string' ? point : (point.point || JSON.stringify(point));
                    analysisHtml += `<li style="margin: 8px 0; line-height: 1.6;"><strong>${escapeHtml(pointText)}</strong>`;
                    if (point.explanation) {
                        analysisHtml += `<br><span style="color: #666; font-size: 14px;">${escapeHtml(point.explanation)}</span>`;
                    }
                    analysisHtml += `</li>`;
                });
                analysisHtml += '</ul>';
            }

            if (data.key_terms && data.key_terms.length > 0) {
                analysisHtml += '<h4 style="color: #333; margin-bottom: 15px;">🔑 Key Terms:</h4>';
                analysisHtml += '<dl style="margin-bottom: 25px;">';
                data.key_terms.forEach(term => {
                    analysisHtml += `<dt style="font-weight: bold; color: #667eea; margin-top: 10px;">${escapeHtml(term.term)}</dt>`;
                    analysisHtml += `<dd style="margin-left: 20px; color: #666; line-height: 1.5;">${escapeHtml(term.definition)}</dd>`;
                });
                analysisHtml += '</dl>';
            }

            if (data.outline) {
                analysisHtml += '<h4 style="color: #333; margin-bottom: 15px;">📋 Outline:</h4>';
                if (data.outline.sections && data.outline.sections.length > 0) {
                    analysisHtml += renderOutlineSections(data.outline.sections);
                } else if (Array.isArray(data.outline)) {
                    analysisHtml += renderOutlineSections(data.outline);
                } else {
                    analysisHtml += '<p style="color: #666;">No outline structure found</p>';
                }
            }

            analysisHtml += '</div>';
            resultContent.innerHTML = analysisHtml;
        }

        function renderOutlineSections(sections, level = 0) {
            let html = '<ul style="margin-left: ' + (level * 20) + 'px; list-style-type: ' + (level === 0 ? 'decimal' : 'disc') + ';">';
            sections.forEach(section => {
                html += `<li style="margin: 8px 0; line-height: 1.6;">
                    <strong>${escapeHtml(section.title)}</strong>`;
                if (section.children && section.children.length > 0) {
                    html += renderOutlineSections(section.children, level + 1);
                }
                html += '</li>';
            });
            html += '</ul>';
            return html;
        }

        function showError(message) {
            result.className = 'result show error';
            resultTitle.textContent = '❌ Error';
            resultContent.innerHTML = `<p><strong>${escapeHtml(message)}</strong></p>`;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>

</html>
